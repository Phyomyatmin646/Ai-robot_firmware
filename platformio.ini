[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Target: ESP32-S3 N16R8 (16MB Flash, 8MB Octal OPI PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = qio_opi

; Compilation Flags
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -I "${platformio.packages_dir}/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-sr/include/esp32s3"
    -I "${platformio.packages_dir}/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-sr/src/include"
    -lespressif__esp-sr
    -lwakenet
    -ldl_lib

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    gilmaimon/ArduinoWebsockets @ ^0.5.4
    lovyan03/LovyanGFX @ ^1.1.16
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit BusIO @ ^1.16.1
